
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Configuração inicial | Expresso Certório</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            background: #F7F1E8;
            color: #3E2723;
            font-family: Arial, sans-serif;
        }

        .cadastro {
            width: 100%;
            max-width: 760px;
            padding: 35px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 35px rgba(62,39,35,.10);
        }

        .marca {
            text-align: center;
            margin-bottom: 28px;
        }

        .marca i {
            font-size: 45px;
            color: #D99A45;
        }

        .marca h1 {
            font-size: 25px;
            font-weight: 800;
            margin-top: 10px;
        }

        .marca p {
            color: #806E63;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            padding: 11px 12px;
            border-radius: 9px;
        }

        .btn-cadastrar {
            background: #3E2723;
            color: #fff;
            padding: 12px;
            border-radius: 9px;
            font-weight: bold;
        }

        .btn-cadastrar:hover {
            background: #654438;
            color: #fff;
        }

        .aviso {
            background: #FFF4DF;
            border: 1px solid #F0D5A6;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
        }

        @media (max-width: 576px) {
            .cadastro {
                padding: 22px 17px;
            }
        }
    </style>
</head>

<body>

<main class="cadastro">

    <header class="marca">
        <i class="bi bi-cup-hot-fill"></i>
        <h1>EXPRESSO CERTÓRIO</h1>
        <p>Configuração do primeiro acesso administrativo</p>
    </header>

    <div class="aviso mb-4">
        <i class="bi bi-shield-lock-fill me-2"></i>
        <strong>Criação do administrador principal.</strong>
        Preencha os dados para configurar sua conta de acesso ao painel.
    </div>

    <div th:if="${erro}" class="alert alert-danger" role="alert"
         th:text="${erro}"></div>

    <form th:action="@{/configurar-admin}"
          th:object="${usuario}"
          method="post">

        <h5 class="mb-3">Dados de acesso</h5>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome completo *</label>
            <input type="text" id="nome" th:field="*{nome}"
                   class="form-control" maxlength="120" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail *</label>
            <input type="email" id="email" th:field="*{email}"
                   class="form-control" maxlength="160" required>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="senha" class="form-label">Senha *</label>
                <input type="password" id="senha" th:field="*{senha}"
                       class="form-control" minlength="8"
                       autocomplete="new-password" required>
            </div>

            <div class="col-md-6">
                <label for="confirmarSenha" class="form-label">
                    Confirmar senha *
                </label>
                <input type="password" id="confirmarSenha"
                       name="confirmarSenha" class="form-control"
                       minlength="8" autocomplete="new-password" required>
            </div>
        </div>

        <hr class="my-4">

        <h5 class="mb-3">Endereço</h5>

        <div class="row g-3">
            <div class="col-md-4">
                <label for="cep" class="form-label">CEP *</label>
                <input type="text" id="cep" th:field="*{cep}"
                       class="form-control" maxlength="9" required>
            </div>

            <div class="col-md-8">
                <label for="estado" class="form-label">Estado *</label>
                <input type="text" id="estado" th:field="*{estado}"
                       class="form-control" maxlength="100" required>
            </div>

            <div class="col-md-6">
                <label for="cidade" class="form-label">Cidade *</label>
                <input type="text" id="cidade" th:field="*{cidade}"
                       class="form-control" maxlength="100" required>
            </div>

            <div class="col-md-6">
                <label for="bairro" class="form-label">Bairro *</label>
                <input type="text" id="bairro" th:field="*{bairro}"
                       class="form-control" maxlength="100" required>
            </div>

            <div class="col-md-8">
                <label for="rua" class="form-label">Rua *</label>
                <input type="text" id="rua" th:field="*{rua}"
                       class="form-control" maxlength="150" required>
            </div>

            <div class="col-md-4">
                <label for="numero" class="form-label">Número *</label>
                <input type="text" id="numero" th:field="*{numero}"
                       class="form-control" maxlength="15" required>
            </div>

            <div class="col-md-6">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" id="telefone" th:field="*{telefone}"
                       class="form-control" maxlength="20">
            </div>

            <div class="col-md-6">
                <label for="complemento" class="form-label">
                    Complemento
                </label>
                <input type="text" id="complemento"
                       th:field="*{complemento}"
                       class="form-control" maxlength="100">
            </div>
        </div>

        <button type="submit" class="btn btn-cadastrar w-100 mt-4">
            <i class="bi bi-shield-check me-2"></i>
            Criar administrador e acessar painel
        </button>
    </form>

    <p class="text-center text-secondary small mt-4 mb-0">
        Expresso Certório — Configuração inicial
    </p>

</main>

</body>
</html>
